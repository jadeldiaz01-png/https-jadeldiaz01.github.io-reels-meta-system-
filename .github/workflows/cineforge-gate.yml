name: cineforge-gate

on:
  pull_request:
    paths:
      - "cineforge/**"
      - "tests/**"
      - "workers/**"
      - "docs/CINEFORGE_ARCHITECTURE.md"
      - ".github/workflows/cineforge-gate.yml"
      - ".github/workflows/deploy-hf-zerogpu.yml"
  push:
    branches: [main]
    paths:
      - "cineforge/**"
      - "tests/**"
      - "workers/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compile contracts and gates
        run: python -m py_compile cineforge/__init__.py cineforge/contracts.py cineforge/quality_gates.py cineforge/image_quality.py cineforge/creative_patterns.py cineforge/render_runtime.py cineforge/free_providers.py cineforge/worker_discovery.py cineforge/gpu_provisioning.py cineforge/smoke_render.py cineforge/zerogpu_client.py cineforge/validate_production_readiness.py workers/hf_zerogpu/space/app.py
      - name: Validate fail-closed policy and reference libraries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('cineforge/policy.json').read_text())
          ref = json.loads(Path('cineforge/reference_video_profile.json').read_text())
          lib = json.loads(Path('cineforge/reference_library.json').read_text())
          pilot = json.loads(Path('cineforge/e2e_pilot.json').read_text())
          free = json.loads(Path('cineforge/free_provider_manifest.json').read_text())
          research = json.loads(Path('cineforge/free_provider_research_2026.json').read_text())
          compute = json.loads(Path('cineforge/free_compute_backends_2026.json').read_text())
          gpu = json.loads(Path('cineforge/gpu_backend_research_2026.json').read_text())
          worker = Path('workers/hf_zerogpu/space/app.py').read_text()
          requirements = Path('workers/hf_zerogpu/space/requirements.txt').read_text()
          deploy = Path('.github/workflows/deploy-hf-zerogpu.yml').read_text()
          assert p['default_decision'] == 'BLOCKED'
          assert p['research']['anti_bot_bypass'] is False
          assert p['research']['cloudflare_stealth_bypass'] is False
          assert p['publication']['human_approval_required'] is True
          assert p['publication']['generated_master_must_not_contain_third_party_watermark'] is True
          assert p['generation']['silent_quality_downgrade'] is False
          assert p['generation']['quality_first_model_routing'] is True
          assert p['generation']['require_creative_pattern_profile'] is True
          assert p['finops']['cost_must_not_override_quality_floor'] is True
          assert ref['source_role'] == 'quality_reference_only'
          assert ref['source_copying_allowed'] is False
          assert lib['source_count'] == 10
          assert lib['usage'] == 'quality_and_pattern_reference_only'
          assert lib['delivery_upgrade']['minimum_resolution'] == '1080x1920'
          assert pilot['concept']['original'] is True
          assert pilot['concept']['reference_source_footage_used'] is False
          assert pilot['status'] in {'PROVIDER_UNAVAILABLE','MASTER_READY'}
          assert free['policy']['fail_closed_when_no_provider_meets_floor'] is True
          assert research['policy']['consumer_free_ui_is_not_production_api'] is True
          assert research['policy']['watermarked_outputs_not_eligible_for_master'] is True
          assert len(research['ranked_candidates']) >= 9
          assert compute['policy']['runtime_detection_required'] is True
          assert compute['policy']['no_assumed_gpu_model'] is True
          assert gpu['smoke_policy']['require_sha256_provenance'] is True
          assert '@spaces.GPU(size="large", duration=270)' in worker
          assert 'CINEFORGE_MODEL_REVISION' in worker
          assert 'RENDERED_QC_PENDING' in worker
          assert 'spaces==0.51.1' in requirements
          assert 'diffusers==0.39.0' in requirements
          assert 'workflow_dispatch:' in deploy
          assert 'issues:' not in deploy
          assert 'expected_sha:' in deploy
          assert 'secrets.HF_TOKEN' in deploy
          assert 'model_info(model_id).sha' in deploy
          PY
      - name: Production-readiness manifest
        run: python cineforge/validate_production_readiness.py
      - name: Require immutable third-party Actions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          bad=[]
          for p in Path('.github/workflows').glob('*.y*ml'):
              for n,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
                  m=re.search(r'\buses:\s*([^\s#]+)',line)
                  if m and not m.group(1).startswith('./') and not re.search(r'@[0-9a-fA-F]{40}$',m.group(1)):
                      bad.append(f'{p}:{n}:{m.group(1)}')
          if bad:
              print('\n'.join(bad)); raise SystemExit('IMMUTABLE_ACTIONS=FAIL')
          print('IMMUTABLE_ACTIONS=PASS')
          PY
      - name: Run deterministic gate tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2
          pytest -q tests/test_cineforge_quality_gates.py tests/test_cineforge_image_quality.py tests/test_cineforge_creative_patterns.py tests/test_cineforge_render_runtime.py tests/test_cineforge_free_providers.py tests/test_cineforge_worker_discovery.py tests/test_cineforge_gpu_provisioning.py tests/test_cineforge_zerogpu_client.py
