name: cineforge-gate

on:
  pull_request:
    paths:
      - "cineforge/**"
      - "tests/**"
      - "docs/CINEFORGE_ARCHITECTURE.md"
      - ".github/workflows/cineforge-gate.yml"
  push:
    branches: [main]
    paths:
      - "cineforge/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile contracts and gates
        run: python -m py_compile cineforge/contracts.py cineforge/quality_gates.py
      - name: Validate fail-closed policy JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('cineforge/policy.json').read_text())
          assert p['default_decision'] == 'BLOCKED'
          assert p['research']['anti_bot_bypass'] is False
          assert p['research']['cloudflare_stealth_bypass'] is False
          assert p['publication']['human_approval_required'] is True
          assert p['generation']['silent_quality_downgrade'] is False
          PY
      - name: Run deterministic gate tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          pytest -q tests/test_cineforge_quality_gates.py
