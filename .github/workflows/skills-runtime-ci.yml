name: skills-runtime-ci

on:
  pull_request:
    paths:
      - "skills/**"
      - "app/skills_runtime/**"
      - "app/skills_runtime_main.py"
      - "policies/skills_*.rego"
      - "tests/**skills_runtime*"
      - "tests/e2e/**"
      - "tests/chaos/**"
      - "db/migrations/002_skills_runtime.sql"
      - "db/migrations/003_skills_runtime_operational.sql"
      - "infra/openbao/**"
      - "docker-compose*.yml"
      - ".github/workflows/skills-runtime-ci.yml"
  push:
    branches: [main, "feat/**"]
    paths:
      - "skills/**"
      - "app/skills_runtime/**"
      - "app/skills_runtime_main.py"
      - "policies/skills_*.rego"
      - "tests/**skills_runtime*"
      - "tests/e2e/**"
      - "tests/chaos/**"
      - "db/migrations/002_skills_runtime.sql"
      - "db/migrations/003_skills_runtime_operational.sql"
      - "infra/openbao/**"
      - "docker-compose*.yml"
      - ".github/workflows/skills-runtime-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate skill contracts
        run: python skills/_framework/validate_skill.py
      - name: Run skill eval harness
        run: python skills/_framework/run_evals.py
      - name: Run Python tests
        run: pytest -q

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: open-policy-agent/setup-opa@v2.4.0
        with:
          version: latest
      - name: Validate and test skill policies
        run: |
          opa check --strict policies/skills_promotion.rego policies/skills_promotion_test.rego policies/skills_execution.rego policies/skills_execution_test.rego
          opa test policies/skills_promotion.rego policies/skills_promotion_test.rego policies/skills_execution.rego policies/skills_execution_test.rego -v

  operational-e2e:
    runs-on: ubuntu-latest
    needs: [validate, policy]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Generate ephemeral sandbox credentials
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "BAO_DEV_ROOT_TOKEN=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - name: Start P1-B stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
      - name: Wait for runtime
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18010/healthz >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs skills-runtime openbao-bootstrap opa postgres
          exit 1
      - name: Run operational E2E
        env:
          RUN_SKILLS_RUNTIME_E2E: "1"
          E2E_DATABASE_URL: postgresql://engine:${{ env.POSTGRES_PASSWORD }}@127.0.0.1:55432/revenue_engine
          E2E_SKILLS_RUNTIME_URL: http://127.0.0.1:18010
          E2E_OPENBAO_URL: http://127.0.0.1:18200
        run: pytest -q tests/e2e/test_skills_runtime_operational.py
      - name: Run dependency outage chaos
        env:
          E2E_SKILLS_RUNTIME_URL: http://127.0.0.1:18010
        run: sh tests/chaos/run_skills_runtime_chaos.sh
      - name: Collect logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v

  production-gate-contract:
    runs-on: ubuntu-latest
    needs: [validate, policy, operational-e2e]
    steps:
      - uses: actions/checkout@v5
      - name: Assert production remains human-gated and fail-closed
        run: |
          grep -q 'critical_human_approval_required' app/skills_runtime/lifecycle.py
          grep -q 'may_approve_production.*false' config/agent_registry.json
          grep -q 'critical_human_approval == true' policies/skills_promotion.rego
          grep -q 'control.revoked == false' policies/skills_execution.rego
          grep -q 'signature_verified == true' policies/skills_execution.rego
          grep -q 'OPENBAO_TOKEN_FILE' docker-compose.yml
          ! grep -q 'OPENBAO_TOKEN:' docker-compose.yml
          grep -q 'transit/verify/skills-runtime' infra/openbao/skills-runtime-policy.hcl
          ! grep -q 'transit/sign/skills-runtime' infra/openbao/skills-runtime-policy.hcl
          grep -q 'transit/sign/skills-runtime' infra/openbao/skills-bundle-signer-policy.hcl
