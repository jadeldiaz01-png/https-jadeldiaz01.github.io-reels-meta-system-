name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  p0c:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: revenue_engine
          POSTGRES_USER: engine
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engine -d revenue_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://engine:ci-only-password@localhost:5432/revenue_engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - name: Apply P0-B and P0-C schemas
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://engine:ci-only-password@localhost:5432/revenue_engine', autocommit=True) as conn:
              for path in ('db/migrations/001_p0b.sql','db/migrations/002_p0c.sql'):
                  sql = open(path, encoding='utf-8').read()
                  for statement in sql.split(';'):
                      if statement.strip():
                          conn.execute(statement)
          PY
      - name: Unit PostgreSQL kill-switch and crash-recovery tests
        run: pytest -q
      - name: Python compile check
        run: python -m compileall -q app
      - name: Rego compile check
        run: docker run --rm -v "$PWD/policies:/policies:ro" openpolicyagent/opa:1.17.0 check /policies/revenue_engine.rego
      - name: OpenBao policy and bootstrap syntax checks
        run: |
          sh -n infra/openbao/bootstrap-sandbox.sh
          test -s infra/openbao/production-evidence-policy.hcl
      - name: Validate compose and application image
        run: |
          docker compose config >/dev/null
          docker build -t revenue-engine:p0c .
