name: deploy-hf-zerogpu

on:
  workflow_dispatch:
    inputs:
      space_id:
        description: "Hugging Face Space id (username/space-name)"
        required: true
        default: "Makubezxjadel/cineforge-zerogpu"
      model_revision:
        description: "Immutable Wan2.2 model revision/commit SHA"
        required: true
      private:
        description: "Create Space private"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cineforge-hf-zerogpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate required secret
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN" || (echo "HF_TOKEN secret missing" && exit 1)
      - name: Install pinned Hub client
        run: python -m pip install --disable-pip-version-check "huggingface_hub==0.35.0"
      - name: Create or update ZeroGPU Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: ${{ inputs.space_id }}
          MODEL_REVISION: ${{ inputs.model_revision }}
          SPACE_PRIVATE: ${{ inputs.private }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          space_id = os.environ["SPACE_ID"]
          revision = os.environ["MODEL_REVISION"].strip()
          private = os.environ["SPACE_PRIVATE"].lower() == "true"

          if len(revision) < 12:
              raise SystemExit("model_revision must be an immutable commit/revision, not a floating branch")

          api = HfApi(token=token)
          api.create_repo(
              repo_id=space_id,
              repo_type="space",
              space_sdk="gradio",
              space_hardware="zero-a10g",
              private=private,
              exist_ok=True,
          )
          api.add_space_variable(
              repo_id=space_id,
              key="CINEFORGE_MODEL_REVISION",
              value=revision,
          )
          api.upload_folder(
              repo_id=space_id,
              repo_type="space",
              folder_path="workers/hf_zerogpu/space",
          )
          runtime = api.get_space_runtime(space_id)
          print({
              "space_id": space_id,
              "stage": runtime.stage,
              "hardware": runtime.hardware,
              "requested_hardware": runtime.requested_hardware,
          })
          PY
      - name: Verify ZeroGPU requested
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: ${{ inputs.space_id }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          runtime = HfApi(token=os.environ["HF_TOKEN"]).get_space_runtime(os.environ["SPACE_ID"])
          requested = str(runtime.requested_hardware or runtime.hardware or "")
          if "zero" not in requested:
              raise SystemExit(f"ZeroGPU not requested: {requested}")
          print(f"ZeroGPU requested: {requested}; stage={runtime.stage}")
          PY
