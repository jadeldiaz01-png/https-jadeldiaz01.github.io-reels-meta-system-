name: deploy-hf-zerogpu

on:
  workflow_dispatch:
    inputs:
      space_id:
        description: "Hugging Face Space id (username/space-name)"
        required: true
        default: "Makubezxjadel/cineforge-zerogpu"
      model_revision:
        description: "Immutable Wan2.2 commit SHA, or AUTO to resolve and pin current SHA"
        required: true
        default: "AUTO"
      private:
        description: "Create Space private"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
  push:
    branches: [main]
    paths:
      - ".cineforge/deploy-hf-zerogpu.trigger"
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'issues' || github.event.issue.title == '[CineForge] Deploy ZeroGPU'
    runs-on: ubuntu-latest
    environment: cineforge-hf-zerogpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate required secret
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN" || (echo "HF_TOKEN secret missing" && exit 1)
      - name: Install pinned Hub client
        run: python -m pip install --disable-pip-version-check "huggingface_hub==0.35.0"
      - name: Create or update ZeroGPU Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: ${{ github.event.inputs.space_id || 'Makubezxjadel/cineforge-zerogpu' }}
          MODEL_REVISION: ${{ github.event.inputs.model_revision || 'AUTO' }}
          SPACE_PRIVATE: ${{ github.event.inputs.private || 'true' }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          space_id = os.environ["SPACE_ID"]
          requested_revision = os.environ["MODEL_REVISION"].strip()
          private = os.environ["SPACE_PRIVATE"].lower() == "true"
          model_id = "Wan-AI/Wan2.2-TI2V-5B-Diffusers"

          api = HfApi(token=token)
          if requested_revision.upper() == "AUTO":
              revision = api.model_info(model_id).sha
          else:
              revision = requested_revision
          if not revision or len(revision) < 12 or revision.lower() in {"main", "master", "latest"}:
              raise SystemExit("model_revision must resolve to an immutable commit SHA")

          api.create_repo(
              repo_id=space_id,
              repo_type="space",
              space_sdk="gradio",
              space_hardware="zero-a10g",
              private=private,
              exist_ok=True,
          )
          api.add_space_variable(
              repo_id=space_id,
              key="CINEFORGE_MODEL_REVISION",
              value=revision,
          )
          api.add_space_variable(
              repo_id=space_id,
              key="CINEFORGE_MODEL_ID",
              value=model_id,
          )
          api.upload_folder(
              repo_id=space_id,
              repo_type="space",
              folder_path="workers/hf_zerogpu/space",
          )
          runtime = api.get_space_runtime(space_id)
          print({
              "space_id": space_id,
              "model_id": model_id,
              "model_revision": revision,
              "stage": runtime.stage,
              "hardware": runtime.hardware,
              "requested_hardware": runtime.requested_hardware,
          })
          PY
      - name: Verify ZeroGPU requested
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: ${{ github.event.inputs.space_id || 'Makubezxjadel/cineforge-zerogpu' }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          runtime = HfApi(token=os.environ["HF_TOKEN"]).get_space_runtime(os.environ["SPACE_ID"])
          requested = str(runtime.requested_hardware or runtime.hardware or "")
          if "zero" not in requested:
              raise SystemExit(f"ZeroGPU not requested: {requested}")
          print(f"ZeroGPU requested: {requested}; stage={runtime.stage}")
          PY
