[project]
name = "autonomous-course-reels-engine"
version = "0.2.0"
description = "Policy-controlled autonomous course, reels and fulfillment engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "pyyaml>=6.0,<7",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
